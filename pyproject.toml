[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-edge"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@0f9dbf4e63b86b692936e6f91d4eda832cbf19ad",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@0ed0ab50548f65fdd63ffb7ef614527a7a5158a6",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@e7c8f42080f41a85a43f5dbbad2cb05ac958c823",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@6095a5d0798fbe4767362a4d4389f112ab050e8e",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@abdcad2f82b827c4898963dc6b3f0025ed68b9d3",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@a04d980e25f71cb1d52fec7f8525633d5eb09e8f",
    "spanopticon-models @ git+https://github.com/hyperme-sh/controlplane-models.git@1b2e49a1590ba24c8d58c1f14aa2bd64d6a6945e",
    "controlplane-proto @ git+https://github.com/hyperme-sh/controlplane-proto.git@438e7ad97168bf8bf12b93885ce6f7a889b46cd1",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "strawberry-graphql[fastapi]>=0.252.0",
    "grpcio>=1.80.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-httpx>=0.50b0"
]

[dependency-groups]
dev = [
    "user-service @ git+https://github.com/hyperme-sh/user-service.git@59b59044884611bc240bd4fc8cbe710781982e3b#subdirectory=core/user-service",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
    "openapi-spec-validator>=0.8.4"
]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_edge"]

[tool.hatch.build.targets.sdist]
include = ["/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
