[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-edge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@de01a06c0cc4661529442fb77be100ab3d26faab",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@6515b0ef67e0d3a6318ac0125c3da10a57146142",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@76f70a942f7c5e7ab57e47541044978e6bae13e5",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@ab482c75d225a0988cf3f6895b2012a7cc5d3066",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@b26ab470c1f5de5840d0dbaeaacffed79b02a83c",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@ede5ef3203f1910856828a058b42b0ee4edf4dda",
    "panopticon-models @ git+https://github.com/hyperme-sh/controlplane-models.git@9fa50f1119a5b4dc45192c86ace2afb7439192af",
    "controlplane-proto @ git+https://github.com/hyperme-sh/controlplane-proto.git@ea43ae275ed17408509cfa593716e3fd52610cfd",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "strawberry-graphql[fastapi]>=0.252.0",
    "grpcio>=1.80.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-httpx>=0.50b0"
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
    "openapi-spec-validator>=0.8.4"
]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_edge"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
