[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-edge"
version = "0.2.0"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@732256a5207ee502d7bf70cb171cf2eea1803b87",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@f252909af772b2c820555af36de456d46f17cfcb",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@5aeff3d2c00568f39ca6e8b75c7e63883d3a510b",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@c3b7b4b65e04de1830f4c24bf00669dca3a97375",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@95ef61433374274f4a4fc287e15982be6357e1cc",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@2a49f9af5f6c4dc9d6c4ddebc83c41d6331e2c87",
    "spanopticon-models @ git+https://github.com/hyperme-sh/controlplane-models.git@9a9bbb20c2e0cd41febf3233ce7a48fe17a84b04",
    "controlplane-proto @ git+https://github.com/hyperme-sh/controlplane-proto.git@0cf9d9f3b81273d1fc742f80cf5adc1fbe0d8446",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "strawberry-graphql[fastapi]>=0.252.0",
    "grpcio>=1.80.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-httpx>=0.50b0"
]

[dependency-groups]
dev = [
    "user-service @ git+https://github.com/hyperme-sh/user-service.git@662c46255d0eaaf16b45ce7bdbe34cfba4c1cc05#subdirectory=core/user-service",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
    "openapi-spec-validator>=0.8.4"
]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_edge"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
