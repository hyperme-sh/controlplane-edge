[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-edge"
version = "0.2.0"
requires-python = ">=3.13"
dependencies = [
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@ba971e08bcbf6ec45ec8e6f0ae26220378aa7cdb",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@26c6207cfa446e819992baaa0df53f3b694f6ced",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@797bb4303075e3e7fb54dd42a1451bfe3fd089fa",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@dd5833c8ebc65bed48fe14968b7f7b5f43418fcb",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@482943cbcd78ffd1a3d2ad4e1088ed7ed0cdeaea",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@ae5aa86dc53b1a9e25ae4527fefeea6da6fb66ea",
    "spanopticon-models @ git+https://github.com/hyperme-sh/controlplane-models.git@a9d39ec27b44f15442eaa7d78485bd84ec744dc2",
    "controlplane-proto @ git+https://github.com/hyperme-sh/controlplane-proto.git@51e61210f272eabdc2a3a8d471a50b26257d866a",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "strawberry-graphql[fastapi]>=0.252.0",
    "grpcio>=1.80.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-httpx>=0.50b0"
]

[dependency-groups]
dev = [
    "user-service @ git+https://github.com/hyperme-sh/user-service.git@7739e59be37a72e9edb1f466cac4dd950e4a215b#subdirectory=core/user-service",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
    "openapi-spec-validator>=0.8.4"
]

[tool.hatch.build.targets.wheel]
packages = ["src/controlplane_edge"]

[tool.hatch.build.targets.sdist]
include = ["/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
