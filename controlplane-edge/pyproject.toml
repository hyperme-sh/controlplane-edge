[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "controlplane-edge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "controlplane-api",
    "controlplane-core",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
    "panopticon-models",
    "strawberry-graphql[fastapi]>=0.252.0",
    "grpcio>=1.80.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-exporter-otlp-proto-http>=1.29.0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
    "openapi-spec-validator>=0.8.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [
    "src",
    "../scripts/sdk-gen",
    "../core/lib/controlplane-core/src",
    "../core/lib/controlplane-db/src",
    "../core/events/src",
    "../core/models/src",
]

[tool.uv.sources]
controlplane-api = { workspace = true }
controlplane-core = { workspace = true }
panopticon-models = { workspace = true }

[tool.hatch.build.targets.wheel]
only-include = ["src/controlplane_edge"]

[tool.hatch.build.targets.sdist]
include = ["src/controlplane_edge"]
