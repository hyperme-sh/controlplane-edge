name: Release admission
# Development PRs use version-policy.yml and package tests, without release history.
on:
  push:
    tags: ['**']
  workflow_dispatch:
    inputs:
      version:
        description: Exact release version (for example 0.24.1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  runtime-admission:
    name: Admit the exact Edge runtime wheel
    if: startsWith(github.ref_type == 'tag' && github.ref_name || inputs.version, 'v0.2.')
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - id: tag
        name: Bind admission to the exact version tag
        env:
          REQUESTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REQUESTED_VERSION" =~ ^v0\.2\.(0|[1-9][0-9]*)$ ]]
          echo "ref=refs/tags/$REQUESTED_VERSION" >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.tag.outputs.ref }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
          enable-cache: false
      - name: Verify the candidate wheel at the version tag
        env:
          REQUESTED_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-version-policy.py
          jq -e --arg version "${REQUESTED_VERSION#v}" '
            .line == "0.2" and .purpose == "stable-release" and .components["controlplane-edge"].version == $version
          ' releases/candidate/release.json >/dev/null
          work=$(mktemp -d "$RUNNER_TEMP/edge-admission.XXXXXX")
          trap 'rm -rf -- "$work"' EXIT
          bash scripts/anonymous-command.sh uv build --out-dir "$work/dist"
          python3 scripts/export_release_contract.py "$work"/dist/*.whl --output "$work/contract"
          python3 scripts/verify_release_candidate.py releases/candidate/release.json "$work/contract/contract.json" \
            "$work/contract/evidence.json" controlplane-edge
          jq -cn --arg version "$REQUESTED_VERSION" --arg revision "$(git rev-parse HEAD)" \
            '{admitted_version:$version,revision:$revision}' | tee -a "$GITHUB_STEP_SUMMARY"
  release-admission:
    if: ${{ !startsWith(github.ref_type == 'tag' && github.ref_name || inputs.version, 'v0.2.') }}
    uses: hyperme-sh/spanopticon/.github/workflows/component-release.yml@32c064be9fe47e230e0d48d353ada8b38a7c1644
    with:
      release-line: '0.2'
      baseline-ref: ${{ vars.SPANOPTICON_RELEASE_BASELINE_SHA }}
      requested-version: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || '' }}
