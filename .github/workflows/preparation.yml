name: Package preparation
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Azure publisher contract without credentials
        run: python3 -m unittest discover -s scripts -p test_azure_publisher.py -v
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
          enable-cache: false
      - name: Qualify package and authorization coverage without inherited credentials
        shell: bash
        run: |
          set -euo pipefail
          output=$(mktemp -d "$RUNNER_TEMP/prepared-package.XXXXXX")
          echo "PREPARED_OUTPUT=$output" >> "$GITHUB_ENV"
          bash scripts/anonymous-command.sh env RELEASE_ARTIFACT_DIR="$output/dist" bash scripts/check-preparation.sh
      - name: Qualify credential-free standalone runtime
        env:
          QUALIFIED_IMAGE_REF: edge:ci-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_ARTIFACT_DIR: ${{ env.PREPARED_OUTPUT }}/dist
        run: >-
          bash scripts/anonymous-command.sh env
          RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR"
          QUALIFIED_IMAGE_REF="$QUALIFIED_IMAGE_REF" GITHUB_SHA="$GITHUB_SHA"
          bash scripts/check-container.sh
      - name: Remove job-owned local runtime image
        if: always()
        run: docker image rm "edge:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
      - name: Remove job-local preparation output
        if: always()
        run: rm -rf -- "$PREPARED_OUTPUT"
