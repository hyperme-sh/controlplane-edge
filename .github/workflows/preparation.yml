name: Package preparation
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Qualify source, wheel and rebuilt source archive
        shell: bash
        run: |
          set -euo pipefail
          output=$(mktemp -d "$RUNNER_TEMP/prepared-package.XXXXXX")
          export RELEASE_ARTIFACT_DIR="$output/dist"
          export PREPARATION_EVIDENCE_DIR="$output/evidence"
          export TEST_EVIDENCE_DIR="$output/consumers"
          echo "PREPARED_OUTPUT=$output" >> "$GITHUB_ENV"
          bash scripts/check-package.sh --fixtures
      - name: Qualify credential-free standalone runtime
        env:
          QUALIFIED_IMAGE_REF: edge:ci-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_ARTIFACT_DIR: ${{ env.PREPARED_OUTPUT }}/dist
        run: bash scripts/check-container.sh
      - name: Remove job-owned local runtime image
        if: always()
        run: docker image rm "edge:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
