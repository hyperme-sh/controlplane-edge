name: Standalone package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    permissions:
      contents: read
      packages: write
    concurrency:
      group: edge-moving-test-${{ github.repository }}
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - name: Prepare release output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/release-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
          enable-cache: false
      - name: Qualify package without inherited credentials
        run: >-
          bash scripts/anonymous-command.sh env
          RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR" bash scripts/check-package.sh
      - name: Qualify credential-free standalone runtime
        env:
          QUALIFIED_IMAGE_REF: edge:ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          bash scripts/anonymous-command.sh env
          RELEASE_ARTIFACT_DIR="$RELEASE_ARTIFACT_DIR"
          QUALIFIED_IMAGE_REF="$QUALIFIED_IMAGE_REF" GITHUB_SHA="$GITHUB_SHA"
          bash scripts/check-container.sh
      - name: Advance moving TEST from qualified current main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_IMAGE_REF: edge:ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/publish-test-runtime.sh
      - name: Remove job-owned local runtime image
        if: always()
        run: docker image rm "edge:ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >/dev/null 2>&1 || true
      - name: Remove job-local package output
        if: always()
        run: rm -rf -- "$RELEASE_ARTIFACT_DIR"
